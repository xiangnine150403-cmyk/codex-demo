<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }
    main {
      width: min(100%, 640px);
      padding: 40px;
      background: white;
      border-radius: 16px;
    }
    p { color: #475569; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h1>欢迎来到 Codex Demo</h1>
    <p>这是一个简单的静态网页，用于展示 Codex 测试项目。</p>
  </main>
</body>
</html>
